name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cxx: g++
          - name: Linux Clang
            os: ubuntu-latest
            cxx: clang++
          - name: macOS AppleClang
            os: macos-latest
            cxx: clang++
          - name: Windows MSVC
            os: windows-latest
            cxx: ""

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then export CXX=${{ matrix.cxx }}; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    name: Linux ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASan+UBSan, TSan]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          if [ "${{ matrix.sanitizer }}" = "TSan" ]; then
            FLAGS="-DTASKPOOL_ENABLE_TSAN=ON"
          else
            FLAGS="-DTASKPOOL_ENABLE_SANITIZERS=ON"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DTASKPOOL_BUILD_BENCHMARKS=OFF $FLAGS

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build --output-on-failure
